<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kero Global Application</title>
    <style>
        /* 🎨 الـ Premium Dark UI الخاص بشركة كيرو تكنولوجي */
        body {
            background-color: #070a13;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 650px;
            background: #0f1626;
            border: 1px solid #2d3748;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .points-badge {
            background: #1e293b;
            border: 1px solid #10b981; /* الزمردي الأخضر للمؤشرات المالية */
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .section-title {
            color: #facc15; /* الذهب الفاخر للعناوين الرئيسية */
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .kero-input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #4a5568;
            color: white;
            padding: 14px;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .kero-input:focus { border-color: #facc15; }
        .btn-gold {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: black;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(250, 204, 21, 0.2); }
        .game-box {
            background: #070a13;
            border: 1px solid #2d3748;
            border-radius: 14px;
            padding: 20px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .results-panel {
            background: #070a13;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <h2 style="margin:0; font-size: 1.4rem;">إمبراطورية كيرو الموحدة 🚀</h2>
            <div class="points-badge">💰 الرصيد الموحد: <span id="user-points">500</span> نقطة</div>
        </div>

        <div style="margin-bottom: 40px;">
            <h3 class="section-title">🔍 محرك البحث الذكي KeroSearch Pro</h3>
            <input type="text" id="search-input" class="kero-input" value="ذر زمبو انميشن" placeholder="اكتب ما تبحث عنه هنا...">
            <button class="btn-gold" onclick="triggerKeroSearch()">بحث وترشيح النتيجة الأولى ⚡</button>
            
            <div class="results-panel" id="search-results">
                <p style="color: #94a3b8; margin: 0;">نتائج زحف العناكب وتصحيح الكلمات ستظهر هنا في النتيجة الأولى...</p>
            </div>
        </div>

        <div>
            <h3 class="section-title">🎮 متجر الألعاب الفوري Kero Play</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: -10px;">تحميل مباشر وطبيعي إلى ملفات جهازك بالنقاط:</p>
            
            <div class="game-box">
                <div>
                    <h4 style="margin: 0 0 5px 0;">🏎️ سباق السيارات المذهلة برو</h4>
                    <span style="color: #facc15; font-size: 0.85rem;">السعر: 100 نقطة في الخفاء</span>
                </div>
                <button style="background: #10b981; color: white; border:none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;" 
                        onclick="triggerGameDownload('game_1', 'سباق السيارات المذهلة برو')">
                    تنزيل للجهاز 📥
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
                                                           </html>
